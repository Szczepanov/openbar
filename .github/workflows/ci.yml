name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Embedded at compile time by analyze.rs. github.sha matches actions/checkout's default
  # revision (the tested merge ref for pull requests, the pushed commit for push runs).
  OPENBAR_GIT_COMMIT: ${{ github.sha }}

jobs:
  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # Decode tests skip without FFmpeg locally; in CI a missing install must fail.
      OPENBAR_REQUIRE_FFMPEG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --component rustfmt
          --component clippy
          --no-self-update
      - name: Toolchain versions
        run: |
          rustup --version
          rustc --version --verbose
          cargo --version
      # The Ubuntu mirror can serve the ~66 MB of FFmpeg packages at <100 kB/s, so the
      # .deb files are cached. The key hashes the exact package set apt would fetch, so
      # a package bump in the archive gets a fresh cache entry instead of a stale one.
      - name: Resolve FFmpeg packages (external decode prerequisite, ADR-0006)
        id: ffmpeg-debs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends --print-uris -qq ffmpeg \
            | grep "^'" | sort > "$RUNNER_TEMP/ffmpeg-debs.txt"
          echo "$(wc -l < "$RUNNER_TEMP/ffmpeg-debs.txt") packages to fetch"
          echo "key=ffmpeg-debs-${{ runner.os }}-$(sha256sum "$RUNNER_TEMP/ffmpeg-debs.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache FFmpeg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-debs
          key: ${{ steps.ffmpeg-debs.outputs.key }}
      - name: Install FFmpeg
        run: |
          mkdir -p ~/.cache/ffmpeg-debs/partial
          sudo apt-get install --yes --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/.cache/ffmpeg-debs" ffmpeg
          # apt leaves root/_apt-owned files; the cache post-step runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/ffmpeg-debs
          ffmpeg -hide_banner -version | head -n 1
      - name: Verify dependency lock
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Labelling package build (FFmpeg + Node)
        # The Python validation job has no FFmpeg. Node is required here so the browser CSV/export
        # contract cannot silently skip in the CI job that owns the decode-backed package test.
        run: |
          node --version
          python3 -m unittest discover -v -s validation/tests -p 'test_label_package.py'
      - name: First tracker comparison
        run: >-
          cargo run --locked -p openbar-cli -- tracker-experiment
          --output target/tracker-experiment.json
      - name: Filter comparison
        run: >-
          cargo run --locked -p openbar-cli -- filter-experiment
          --output target/filter-experiment.json
      - name: Benchmark regression smoke
        run: >-
          cargo run --locked -p openbar-cli -- benchmark
          --suite validation/benchmarks/synthetic-tracker-smoke.benchmark-v1.json
          --output target/benchmark-smoke.json
      - name: Benchmark result schema
        run: >-
          python3 validation/tools/schema_check.py
          --schema validation/schema/benchmark-result-v1.schema.json
          target/benchmark-smoke.json
      - name: Decoded-video tracker smoke
        run: >-
          cargo run --locked -p openbar-cli -- tracker-run
          --manifest validation/fixtures/public/manifest.json
          --fixture synthetic-clean-side-12
          --seed validation/fixtures/public/seeds/synthetic-clean-side-12.manual-target-seed-v1.json
          --output-dir target/tracker-run-smoke
      - name: Tracker prediction schema
        run: >-
          python3 validation/tools/schema_check.py
          --schema validation/schema/tracker-prediction-v1.schema.json
          target/tracker-run-smoke/synthetic-clean-side-12.template-sad-v1.prediction-v1.json
          target/tracker-run-smoke/synthetic-clean-side-12.local-contrast-centroid-v1.prediction-v1.json
      - name: Canonical analyze smoke
        run: >-
          cargo run --locked -p openbar-cli -- analyze
          --manifest validation/fixtures/public/manifest.json
          --fixture synthetic-clean-side-12
          --seed validation/fixtures/public/seeds/synthetic-clean-side-12.manual-target-seed-v1.json
          --plate-diameter-m 0.45
          --tracker template
          --filter raw
          --kinematics-max-gap-s 0.2
          --kinematics-min-confidence 0
          --output target/analyze-smoke.json
      - name: Canonical analysis schema
        run: >-
          python3 validation/tools/schema_check.py
          --schema validation/schema/analysis-v1.schema.json
          target/analyze-smoke.json
      - name: Diagnostic render success smoke
        run: >-
          cargo run --locked -p openbar-cli -- render
          --analysis target/analyze-smoke.json
          --video validation/fixtures/public/synthetic-clean-side-12.mp4
          --output target/render-success.svg
      - name: Diagnostic render failure smoke
        run: >-
          cargo run --locked -p openbar-cli -- render
          --analysis crates/openbar-core/tests/fixtures/analysis-v1.golden.json
          --output target/render-failure.svg
      - name: Reproducible M0 public evidence package
        run: >-
          python3 validation/tools/m0_evidence.py
          --output-dir target/m0-evidence
      - name: M0 evidence schema
        run: >-
          python3 validation/tools/schema_check.py
          --schema validation/schema/m0-evidence-v1.schema.json
          target/m0-evidence/m0-evidence-v1.json
      - name: M0 evidence report
        run: |
          diff -u docs/validation/M0_EVIDENCE_REPORT.md target/m0-evidence/M0_EVIDENCE_REPORT.md
          cat target/m0-evidence/M0_EVIDENCE_REPORT.md
          cat target/m0-evidence/M0_EVIDENCE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M0 smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m0-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/tracker-experiment.json
            target/filter-experiment.json
            target/benchmark-smoke.json
            target/analyze-smoke.json
            target/render-success.svg
            target/render-failure.svg
            target/tracker-run-smoke/
            target/m0-evidence/
          if-no-files-found: error
          retention-days: 14

  rust-windows:
    # Primary development happens on Windows; this catches line-ending and path regressions.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      OPENBAR_REQUIRE_FFMPEG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --no-self-update
      - name: Toolchain versions
        run: |
          rustup --version
          rustc --version --verbose
          cargo --version
      - name: Install FFmpeg (external decode prerequisite, ADR-0006)
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -hide_banner -version
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: First tracker comparison
        run: >-
          cargo run --locked -p openbar-cli -- tracker-experiment
          --output target/tracker-experiment.json
      - name: Benchmark regression smoke
        run: >-
          cargo run --locked -p openbar-cli -- benchmark
          --suite validation/benchmarks/synthetic-tracker-smoke.benchmark-v1.json
          --output target/benchmark-smoke.json
      - name: Decoded-video tracker smoke
        run: >-
          cargo run --locked -p openbar-cli -- tracker-run
          --manifest validation/fixtures/public/manifest.json
          --fixture synthetic-clean-side-12
          --seed validation/fixtures/public/seeds/synthetic-clean-side-12.manual-target-seed-v1.json
          --output-dir target/tracker-run-smoke
      - name: Tracker prediction schema
        run: >-
          python validation/tools/schema_check.py
          --schema validation/schema/tracker-prediction-v1.schema.json
          target/tracker-run-smoke/synthetic-clean-side-12.template-sad-v1.prediction-v1.json
          target/tracker-run-smoke/synthetic-clean-side-12.local-contrast-centroid-v1.prediction-v1.json
      - name: Canonical analyze smoke
        run: >-
          cargo run --locked -p openbar-cli -- analyze
          --manifest validation/fixtures/public/manifest.json
          --fixture synthetic-clean-side-12
          --seed validation/fixtures/public/seeds/synthetic-clean-side-12.manual-target-seed-v1.json
          --plate-diameter-m 0.45
          --tracker template
          --filter raw
          --kinematics-max-gap-s 0.2
          --kinematics-min-confidence 0
          --output target/analyze-smoke.json
      - name: Canonical analysis schema
        run: >-
          python validation/tools/schema_check.py
          --schema validation/schema/analysis-v1.schema.json
          target/analyze-smoke.json
      - name: Diagnostic render success smoke
        run: >-
          cargo run --locked -p openbar-cli -- render
          --analysis target/analyze-smoke.json
          --video validation/fixtures/public/synthetic-clean-side-12.mp4
          --output target/render-success.svg
      - name: Diagnostic render failure smoke
        run: >-
          cargo run --locked -p openbar-cli -- render
          --analysis crates/openbar-core/tests/fixtures/analysis-v1.golden.json
          --output target/render-failure.svg

  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licences, advisories, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  validation:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Python version
        run: python --version
      - name: Python syntax
        run: python -m compileall -q validation/tools validation/tests
      - name: Validation tooling tests
        run: python -m unittest discover -v -s validation/tests -p 'test_*.py'
      - name: Committed fixtures match their schemas
        run: python validation/tools/schema_check.py
      - name: Recording-envelope evidence study
        run: >-
          python validation/tools/recording_envelope_evidence.py
          --study validation/recording-envelope/m0-study-v1.json
          --output target/recording-envelope-evidence-v1.json
          --report target/RECORDING_ENVELOPE_EVIDENCE.md
      - name: Recording-envelope evidence schema
        run: >-
          python validation/tools/schema_check.py
          --schema validation/schema/recording-envelope-evidence-v1.schema.json
          target/recording-envelope-evidence-v1.json
      - name: Recording-envelope report is reproducible
        run: diff -u docs/validation/RECORDING_ENVELOPE_EVIDENCE.md target/RECORDING_ENVELOPE_EVIDENCE.md
      - name: Validate committed annotation fixture
        run: >-
          python validation/tools/annotations.py validate
          --manifest validation/fixtures/public/manifest.json
          validation/fixtures/public/annotations/synthetic-clean-side-12.annotation-v1.json
