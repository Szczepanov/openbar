name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: First tracker comparison
        run: >-
          cargo run -p openbar-cli -- tracker-experiment
          --output target/tracker-experiment.json
      - name: Benchmark regression smoke
        run: >-
          cargo run -p openbar-cli -- benchmark
          --suite validation/benchmarks/synthetic-tracker-smoke.benchmark-v1.json
          --output target/benchmark-smoke.json

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python3 -m py_compile validation/tools/annotations.py validation/tests/test_annotations.py
      - name: Annotation contract tests
        run: python3 -m unittest discover -s validation/tests -p 'test_*.py'
      - name: Validate committed annotation fixture
        run: >-
          python3 validation/tools/annotations.py validate
          --manifest validation/fixtures/public/manifest.json
          validation/fixtures/public/annotations/synthetic-clean-side-12.annotation-v1.json
